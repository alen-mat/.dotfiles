# ==========================================
# 1. Core Ergonomics & Sensible Defaults
# ==========================================

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -s extended-keys on
set -as terminal-features 'foot*:extkeys'
set-option -g default-shell /usr/bin/zsh
set -g prefix C-a
bind C-a send-prefix

# Enable full mouse support (scroll, resize, click tabs)
set -g mouse on

# 1-based indexing (matches your keyboard layout: 1 to 9)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Eliminate Vim mode switching delay
set -s escape-time 0

# Bump scrollback history limit (default is 2000)
set -g history-limit 50000

# True color support (24-bit color inside Alacritty, Kitty, iTerm2, etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ==========================================
# 2. Keybindings & Navigation
# ==========================================

# Reload config with 'Prefix + r'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes with '|' and '-' (opens in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new window in current path
bind c new-window -c "#{pane_current_path}"


# ==========================================
# Smart Pane Switching & Resizing (Foot + Neovim)
# ==========================================

# Active process check for Vim / Neovim
is_vim="echo '#{pane_current_command}' | grep -iqE '(nvim|vim)'"

# --- SMART NAVIGATION (Alt + h/j/k/l) ---
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# --- SMART RESIZING (Alt + Ctrl + h/j/k/l) ---
bind-key -n 'M-C-h' if-shell "$is_vim" 'send-keys M-C-h' 'resize-pane -L 5'
bind-key -n 'M-C-j' if-shell "$is_vim" 'send-keys M-C-j' 'resize-pane -D 5'
bind-key -n 'M-C-k' if-shell "$is_vim" 'send-keys M-C-k' 'resize-pane -U 5'
bind-key -n 'M-C-l' if-shell "$is_vim" 'send-keys M-C-l' 'resize-pane -R 5'

# Direct window switching with Alt + Left/Right (no prefix needed)
bind -n M-Left previous-window
bind -n M-Right next-window

# ==========================================
# 3. Native Vim Copy-Mode (Scroll & Selection)
# ==========================================

# Use Vim keys in copy mode (Prefix + [ to enter copy mode)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# 4. Sleek Native Status Bar & Borders
# ==========================================

# Position bar at top
set -g status-position top
set -g status-interval 2

# Status bar colors (Dark Mocha palette)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side: Highlighted Session Name (#S)
set -g status-left-length 50
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[bg=default,fg=#89b4fa] "

# Right side: Hostname only (Date & Time removed)
set -g status-right-length 40
set -g status-right "#[fg=#89b4fa,bold]#H "

# Window tabs formatting
set -g window-status-current-format "#[fg=#f38ba8,bold][#I:#W*]"
set -g window-status-format "#[fg=#6c7086]#I:#W"
set -g window-status-separator "  "

# Active/Inactive Pane Borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ==========================================
# Crisp Pane Separation & Contrast
# ==========================================

# 1. Thicker / Distinct Border Lines (tmux 3.2+)
# Options: single, double, heavy, simple, number
set -g pane-border-lines single

# 2. Border Colors (Inactive vs Active)
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# 3. Dim inactive splits (Creates a strong visual distinction)
set -g window-style "bg=#181825"
set -g window-active-style "bg=#1e1e2e"

# 4. Optional: Add small title bars/labels on top of each pane
set -g pane-border-status top
set -g pane-border-format "#[fg=#89b4fa,bold] [#P: #{pane_current_command}] "
