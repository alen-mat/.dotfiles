general {
    lock_cmd = caelestia shell lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

#listener {
#    timeout = 60 # 3mins
#    on-timeout = hyprctl eval "require('utils').screensaver.start()"
#    on-resume = hyprctl eval "require('utils').screensaver.stop()"
#}
listener {
    timeout = 60 # 3 mins
    on-timeout = /home/alen/.config/hypr/hyprsave start
    on-resume = /home/alen/.config/hypr/hyprsave stop
}
listener {
    timeout = 180 # 3mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300 # 5mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600 # 10mins
    on-timeout = systemctl suspend-then-hibernate || loginctl suspend
}
